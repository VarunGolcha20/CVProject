<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GestureBall Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; color: #e0e8ff; overflow: hidden; }
        
        #hud { display: flex; align-items: center; justify-content: space-between; width: 900px; padding: 10px 0; position: relative; }
        .score-val { font-size: 48px; font-weight: bold; }
        .timer { font-size: 32px; opacity: 0.8; }
        
        #canvas-wrap { position: relative; margin-top: 10px; }
        canvas { background: #0d1528; border: 4px solid #1a263a; display: block; border-radius: 4px; }
        
        /* Team Latency Displays - No longer overlapping score */
        .lat-box { position: absolute; top: 60px; font-size: 11px; font-weight: bold; width: 200px; }
        #ping-alpha { left: 0; color: #4fc3f7; text-align: left; }
        #ping-omega { right: 0; color: #ef9a9a; text-align: right; }
        
        #status-msg { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); color: gold; font-weight: bold; z-index: 5; }

        .overlay-layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,15,30,0.96); z-index: 10; gap: 15px; }
        .hidden { display: none !important; }
        .btn { padding: 12px 30px; background: #4fc3f7; border: none; font-weight: bold; cursor: pointer; color: #0a0f1e; text-transform: uppercase; border-radius: 4px; }
        select { background: #1a263a; color: white; border: 1px solid #4fc3f7; padding: 8px; font-family: inherit; }
    </style>
</head>
<body>

<div id="hud">
    <div style="color: #4fc3f7">ALPHA <span class="score-val" id="score1">0</span></div>
    <div id="ping-alpha" class="lat-box"></div>
    
    <div class="timer" id="timer">5:00</div>
    
    <div id="ping-omega" class="lat-box"></div>
    <div style="color: #ef9a9a; text-align: right;">OMEGA <span class="score-val" id="score2">0</span></div>
</div>

<div id="canvas-wrap">
    <div id="status-msg"></div>
    <canvas id="c" width="900" height="560"></canvas>

    <div id="overlay" class="overlay-layer">
        <h1>GESTUREBALL</h1>
        <div>SIZE: <select id="playerCount"><option value="2">1v1</option><option value="4" selected>2v2</option><option value="6">3v3</option></select></div>
        <div>SLOT: <select id="playerSelect"></select></div>
        <button class="btn" onclick="startGame()">Kick Off</button>
        <p style="font-size: 11px; opacity: 0.6;">[M] MOVE · [S] SHOOT · [P] PASS · [SPACE] PAUSE</p>
    </div>

    <div id="win-screen" class="overlay-layer hidden">
        <h2 style="color: gold">MATCH ENDED</h2>
        <div style="font-size: 48px;" id="winner-name"></div>
        <div style="font-size: 24px; margin-bottom: 15px;" id="final-score"></div>
        <button class="btn" onclick="restartMatch()">Main Menu</button>
    </div>
</div>

<div style="margin-top: 20px; display: flex; gap: 10px;">
    <button class="btn" onclick="togglePause()">Pause / Resume</button>
    <button class="btn" style="background: #ef9a9a;" onclick="restartMatch()">Reset Match</button>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const socket = new WebSocket("ws://192.168.44.177:8760");

    const updateDropdown = (val) => {
        const sel = document.getElementById('playerSelect'); sel.innerHTML = "";
        for(let i=1; i<=val; i++) sel.innerHTML += `<option value="${i}">Player ${i}</option>`;
    };
    document.getElementById('playerCount').onchange = (e) => updateDropdown(e.target.value);
    updateDropdown(4);

    socket.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'pong') {
            const lat = Date.now() - data.time;
            socket.send(JSON.stringify({ type: 'lat_update', lat: lat }));
            return;
        }

        // HUD & Overlays
        document.getElementById('overlay').classList.toggle('hidden', data.phase !== 'waiting');
        document.getElementById('win-screen').classList.toggle('hidden', data.phase !== 'gameover');
        document.getElementById('status-msg').textContent = (data.phase === 'paused') ? "|| PAUSED" : "";
        
        if (data.phase === 'gameover') {
            document.getElementById('winner-name').textContent = data.winner + " WINS!";
            document.getElementById('final-score').textContent = `${data.score[0]} - ${data.score[1]}`;
        }

        const m = Math.floor(data.time/60), s = String(Math.floor(data.time%60)).padStart(2,'0');
        document.getElementById('timer').textContent = `${m}:${s}`;
        document.getElementById('score1').textContent = data.score[0];
        document.getElementById('score2').textContent = data.score[1];
        
        // Multi-player latency split by team
        let alphaLats = [], omegaLats = [];
        const half = data.players.length / 2;
        
        Object.entries(data.lats).forEach(([pid, lat]) => {
            const str = `P${pid}: ${lat}ms`;
            if (parseInt(pid) <= half) alphaLats.push(str);
            else omegaLats.push(str);
        });

        document.getElementById('ping-alpha').textContent = alphaLats.join(" | ");
        document.getElementById('ping-omega').textContent = omegaLats.join(" | ");

        render(data);
    };

    function startGame() { socket.send(JSON.stringify({ type: 'ready', count: parseInt(document.getElementById('playerCount').value) })); }
    function restartMatch() { socket.send(JSON.stringify({ type: 'restart' })); }
    function togglePause() { socket.send(JSON.stringify({ type: 'pause' })); }

    setInterval(() => { if (socket.readyState === 1) socket.send(JSON.stringify({ type: 'ping', time: Date.now() })); }, 2000);

    window.onkeydown = (e) => {
        const pId = document.getElementById('playerSelect').value;
        const k = e.key.toLowerCase();
        if (k === 'm') socket.send(JSON.stringify({ type: 'input', player: pId, move: 'MOVE' }));
        if (k === 's') socket.send(JSON.stringify({ type: 'input', player: pId, move: 'SHOOT' }));
        if (k === 'p') socket.send(JSON.stringify({ type: 'input', player: pId, move: 'PASS' }));
        if (e.code === 'Space') togglePause();
    };
    window.onkeyup = (e) => { if (e.key.toLowerCase() === 'm') socket.send(JSON.stringify({ type: 'input', player: document.getElementById('playerSelect').value, move: 'STOP' })); };

    function render(gs) {
        ctx.clearRect(0,0,900,560);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2; ctx.strokeRect(30,40,840,480);
        ctx.beginPath(); ctx.moveTo(450,40); ctx.lineTo(450,520); ctx.stroke();
        ctx.beginPath(); ctx.arc(450,280,60,0,6.28); ctx.stroke();
        ctx.lineWidth = 5; ctx.strokeStyle = '#4fc3f7'; ctx.strokeRect(10,200,20,160);
        ctx.strokeStyle = '#ef9a9a'; ctx.strokeRect(870,200,20,160);
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(gs.ball.x, gs.ball.y, 11, 0, 7); ctx.fill();
        gs.players.forEach(p => {
            ctx.fillStyle = p.team === 0 ? '#4fc3f7' : '#ef9a9a';
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7); ctx.fill();
            ctx.strokeStyle = (gs.ball.holder === p.pid) ? 'gold' : 'white';
            ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + Math.cos(p.angle)*35, p.y + Math.sin(p.angle)*35); ctx.stroke();
        });
    }
</script>
</body>
</html>
